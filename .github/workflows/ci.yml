name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app + core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
      - name: Core tests, app unit tests, lint, debug APK
        run: ./gradlew :core:jvmTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/tests
            app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: SRCS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios-core:
    name: Shared core on iOS (simulator tests + device framework)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SRCS_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Run all shared tests on the iPhone simulator
        run: ./gradlew :core:iosSimulatorArm64Test --stacktrace
      - name: Build the iPhone (device) framework
        run: ./gradlew :core:linkReleaseFrameworkIosArm64 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: core/build/reports/tests
