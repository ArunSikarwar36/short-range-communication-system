# XcodeGen spec for the SRCS iPhone app. Generate the Xcode project on a Mac with:
#   ios/scripts/build-deps.sh && (cd ios && xcodegen generate)
# CI (.github/workflows/ci.yml) does this and builds an unsigned .ipa for sideloading.
name: SRCS
options:
  bundleIdPrefix: ai.paai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SRCS:
    type: application
    platform: iOS
    sources:
      - path: SRCS
    info:
      path: SRCS/Info.plist
      properties:
        CFBundleDisplayName: SRCS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "SRCS uses the microphone for calls, group calls and the walkie-talkie. Audio goes only to the phones in the call, encrypted."
        NSLocalNetworkUsageDescription: "SRCS talks directly to nearby phones on the same Wi-Fi network (for example an Android phone hosting an SRCS group). No internet is used."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.paai.srcs
        PRODUCT_NAME: SRCS
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: SRCS/SRCS-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/opus
        OTHER_LDFLAGS: [-ObjC]
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: ../core/build/XCFrameworks/release/SrcsCore.xcframework
        embed: false
      - framework: build/SrcsOpus.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: AVFoundation.framework
  SRCSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SRCSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.paai.srcs.uitests
        TEST_TARGET_NAME: SRCS
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SRCS
schemes:
  SRCS:
    build:
      targets:
        SRCS: all
        SRCSUITests: [test]
    test:
      targets:
        - SRCSUITests
